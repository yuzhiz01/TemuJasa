<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TemuJasa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/temujasa.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-shell">
    <div class="auth-card auth-card-login">
        <div class="auth-brand">
            <div class="logo-icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <span>TemuJasa</span>
        </div>

        <div class="auth-header">
            <h2 class="auth-title">Selamat Datang</h2>
            <p class="auth-subtitle">Masuk ke akun TemuJasa Anda</p>
        </div>

        <form class="auth-form" onsubmit="return false;">
            <div class="auth-form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    class="auth-input"
                    placeholder="nama@email.com"
                    value=""
                    required
                    autofocus
                >
            </div>

            <div class="auth-form-group">
                <label for="password">Password</label>
                <div class="auth-input-wrap">
                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="auth-input"
                        placeholder="Masukkan password"
                        required
                    >
                    <button class="btn-toggle-pw" type="button" aria-label="Lihat password" onclick="TJDash.togglePassword(this)">
                        <i class="fa-regular fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="auth-check">
                    <input type="checkbox" name="remember" value="1">
                    <span>Ingat saya</span>
                </label>
                <a href="#">Lupa password?</a>
            </div>

            <button type="submit" class="btn-auth-submit">Masuk</button>
        </form>

        <div class="auth-divider"><span>atau</span></div>

        <div class="auth-footer-text">
            Belum punya akun?
            <a href="../register/">Daftar sekarang</a>
        </div>
    </div>
</div>
    <script src="../js/dashboard.js" defer></script>
    <script src="../js/auth.js" defer></script>
</body>
</html>
